name: librarry

services:
  postgres:
    image: postgres:16-alpine
    container_name: librarry-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-librarry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-librarry}
    volumes:
      - ${LIBRARRY_APPDATA_PATH:-/mnt/user/appdata/librarry}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-librarry}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ${LIBRARRY_API_IMAGE:-ghcr.io/bandoracer/librarry-api:latest}
    container_name: librarry-api
    user: "${PUID:-99}:${PGID:-100}"
    restart: unless-stopped
    environment:
      LIBRARRY_LISTEN_ADDR: :8080
      LIBRARRY_API_KEY: ${LIBRARRY_API_KEY:-}
      LIBRARRY_DATABASE_URL: ${LIBRARRY_DATABASE_URL:-postgres://librarry:change-me@postgres:5432/librarry?sslmode=disable}
      LIBRARRY_MIGRATIONS_DIR: /app/backend/migrations
      LIBRARRY_WEB_ORIGIN: ${LIBRARRY_WEB_ORIGIN:-http://tower.local:30200}
      LIBRARRY_HARDCOVER_TOKEN: ${LIBRARRY_HARDCOVER_TOKEN:-}
      LIBRARRY_GOOGLE_BOOKS_API_KEY: ${LIBRARRY_GOOGLE_BOOKS_API_KEY:-}
      LIBRARRY_PROWLARR_URL: ${LIBRARRY_PROWLARR_URL:-}
      LIBRARRY_PROWLARR_API_KEY: ${LIBRARRY_PROWLARR_API_KEY:-}
      LIBRARRY_QBITTORRENT_URL: ${LIBRARRY_QBITTORRENT_URL:-}
      LIBRARRY_QBITTORRENT_USERNAME: ${LIBRARRY_QBITTORRENT_USERNAME:-}
      LIBRARRY_QBITTORRENT_PASSWORD: ${LIBRARRY_QBITTORRENT_PASSWORD:-}
      LIBRARRY_TRANSMISSION_URL: ${LIBRARRY_TRANSMISSION_URL:-}
      LIBRARRY_TRANSMISSION_USERNAME: ${LIBRARRY_TRANSMISSION_USERNAME:-}
      LIBRARRY_TRANSMISSION_PASSWORD: ${LIBRARRY_TRANSMISSION_PASSWORD:-}
      LIBRARRY_SABNZBD_URL: ${LIBRARRY_SABNZBD_URL:-}
      LIBRARRY_SABNZBD_API_KEY: ${LIBRARRY_SABNZBD_API_KEY:-}
      LIBRARRY_SABNZBD_USERNAME: ${LIBRARRY_SABNZBD_USERNAME:-}
      LIBRARRY_SABNZBD_PASSWORD: ${LIBRARRY_SABNZBD_PASSWORD:-}
      LIBRARRY_EBOOK_CATEGORY: ${LIBRARRY_EBOOK_CATEGORY:-books-ebook}
      LIBRARRY_AUDIOBOOK_CATEGORY: ${LIBRARRY_AUDIOBOOK_CATEGORY:-books-audiobook}
      LIBRARRY_BOOK_TORRENT_ROOT: ${LIBRARRY_BOOK_TORRENT_ROOT:-/data/torrents/books}
      LIBRARRY_EBOOK_LIBRARY_ROOT: ${LIBRARRY_EBOOK_LIBRARY_ROOT:-/data/media/books/ebooks}
      LIBRARRY_AUDIOBOOK_LIBRARY_ROOT: ${LIBRARRY_AUDIOBOOK_LIBRARY_ROOT:-/data/media/books/audiobooks}
      LIBRARRY_NAMING_AUTHOR_FOLDER: ${LIBRARRY_NAMING_AUTHOR_FOLDER:-{Author}}
      LIBRARRY_NAMING_BOOK_FOLDER: ${LIBRARRY_NAMING_BOOK_FOLDER:-{Title}}
      LIBRARRY_NAMING_FILE_NAME: ${LIBRARRY_NAMING_FILE_NAME:-{Title}{Ext}}
      LIBRARRY_NAMING_SPACE_REPLACEMENT: ${LIBRARRY_NAMING_SPACE_REPLACEMENT:-}
      LIBRARRY_STANDARD_SEARCH_LANGUAGE: ${LIBRARRY_STANDARD_SEARCH_LANGUAGE:-English}
      LIBRARRY_MONITOR_ENABLED: ${LIBRARRY_MONITOR_ENABLED:-true}
      LIBRARRY_MONITOR_INTERVAL: ${LIBRARRY_MONITOR_INTERVAL:-30m}
      LIBRARRY_MONITOR_SEARCH_INTERVAL: ${LIBRARRY_MONITOR_SEARCH_INTERVAL:-6h}
      LIBRARRY_MONITOR_LIMIT: ${LIBRARRY_MONITOR_LIMIT:-50}
      LIBRARRY_MONITOR_AUTO_GRAB: ${LIBRARRY_MONITOR_AUTO_GRAB:-false}
      LIBRARRY_AUTHOR_MONITOR_ENABLED: ${LIBRARRY_AUTHOR_MONITOR_ENABLED:-true}
      LIBRARRY_AUTHOR_MONITOR_INTERVAL: ${LIBRARRY_AUTHOR_MONITOR_INTERVAL:-6h}
      LIBRARRY_AUTHOR_MONITOR_SYNC_INTERVAL: ${LIBRARRY_AUTHOR_MONITOR_SYNC_INTERVAL:-24h}
      LIBRARRY_AUTHOR_MONITOR_LIMIT: ${LIBRARRY_AUTHOR_MONITOR_LIMIT:-50}
      LIBRARRY_FEED_SYNC_ENABLED: ${LIBRARRY_FEED_SYNC_ENABLED:-true}
      LIBRARRY_FEED_SYNC_INTERVAL: ${LIBRARRY_FEED_SYNC_INTERVAL:-15m}
      LIBRARRY_FEED_SYNC_LIMIT: ${LIBRARRY_FEED_SYNC_LIMIT:-100}
      LIBRARRY_FEED_SYNC_AUTO_GRAB: ${LIBRARRY_FEED_SYNC_AUTO_GRAB:-false}
      LIBRARRY_FAILED_DOWNLOAD_ENABLED: ${LIBRARRY_FAILED_DOWNLOAD_ENABLED:-true}
      LIBRARRY_FAILED_DOWNLOAD_INTERVAL: ${LIBRARRY_FAILED_DOWNLOAD_INTERVAL:-30m}
      LIBRARRY_FAILED_DOWNLOAD_STALLED_AGE: ${LIBRARRY_FAILED_DOWNLOAD_STALLED_AGE:-24h}
      LIBRARRY_FAILED_DOWNLOAD_LIMIT: ${LIBRARRY_FAILED_DOWNLOAD_LIMIT:-50}
      LIBRARRY_FAILED_DOWNLOAD_AUTO_GRAB: ${LIBRARRY_FAILED_DOWNLOAD_AUTO_GRAB:-false}
      LIBRARRY_FAILED_DOWNLOAD_REMOVE: ${LIBRARRY_FAILED_DOWNLOAD_REMOVE:-false}
      LIBRARRY_FAILED_DOWNLOAD_DELETE_FILES: ${LIBRARRY_FAILED_DOWNLOAD_DELETE_FILES:-false}
      LIBRARRY_UPGRADE_SEARCH_ENABLED: ${LIBRARRY_UPGRADE_SEARCH_ENABLED:-true}
      LIBRARRY_UPGRADE_SEARCH_INTERVAL: ${LIBRARRY_UPGRADE_SEARCH_INTERVAL:-12h}
      LIBRARRY_UPGRADE_SEARCH_LIMIT: ${LIBRARRY_UPGRADE_SEARCH_LIMIT:-50}
      LIBRARRY_UPGRADE_SEARCH_AUTO_GRAB: ${LIBRARRY_UPGRADE_SEARCH_AUTO_GRAB:-false}
      LIBRARRY_UPGRADE_SEARCH_MIN_DELTA: ${LIBRARRY_UPGRADE_SEARCH_MIN_DELTA:-5}
      LIBRARRY_CALIBRE_REFRESH_ENABLED: ${LIBRARRY_CALIBRE_REFRESH_ENABLED:-true}
      LIBRARRY_CALIBRE_REFRESH_INTERVAL: ${LIBRARRY_CALIBRE_REFRESH_INTERVAL:-15m}
      LIBRARRY_CALIBRE_REFRESH_LIMIT: ${LIBRARRY_CALIBRE_REFRESH_LIMIT:-200}
      LIBRARRY_CALIBRE_REFRESH_MAX_ATTEMPTS: ${LIBRARRY_CALIBRE_REFRESH_MAX_ATTEMPTS:-1}
    volumes:
      - ${LIBRARRY_MEDIA_STACK_PATH:-/mnt/user/media-stack}:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    image: ${LIBRARRY_WEB_IMAGE:-ghcr.io/bandoracer/librarry-web:latest}
    container_name: librarry-web
    restart: unless-stopped
    labels:
      net.unraid.docker.icon: "https://raw.githubusercontent.com/bandoracer/librarry/main/web/public/favicon.svg"
      net.unraid.docker.webui: "http://[IP]:[PORT:30200]/"
      net.unraid.docker.shell: "sh"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${LIBRARRY_WEB_PORT:-30200}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
