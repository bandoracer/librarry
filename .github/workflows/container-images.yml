name: Container Images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/container-images.yml"
      - "scripts/image-publication.py"
      - "scripts/test-image-publication.py"
      - ".dockerignore"
      - "backend/**"
      - "deploy/Dockerfile.api"
      - "deploy/Dockerfile.web"
      - "deploy/nginx.conf"
      - "go.mod"
      - "go.sum"
      - "web/**"
  workflow_dispatch:
    inputs:
      publish_candidate:
        description: "Publish candidate images for qualification (never latest or a release tag)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  publication:
    name: Check image publication policy
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.policy.outputs.publish }}
      tag: ${{ steps.policy.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/test-image-publication.py
      - id: policy
        env:
          INPUT_PUBLISH_CANDIDATE: ${{ inputs.publish_candidate }}
        run: python3 scripts/image-publication.py
  build:
    needs: publication
    name: Build ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: librarry-api
            dockerfile: deploy/Dockerfile.api
          - name: librarry-web
            dockerfile: deploy/Dockerfile.web

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.publication.outputs.tag }}

      - name: Log in to GHCR
        if: needs.publication.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.publication.outputs.publish == 'true' }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}

      - name: Record published candidate digest
        if: needs.publication.outputs.publish == 'true'
        env:
          CANDIDATE_TAG: ${{ needs.publication.outputs.tag }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json, os, re
          digest = os.environ["DIGEST"]
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              raise SystemExit("Build did not return a candidate digest")
          record = {"sourceCommit": os.environ["GITHUB_SHA"],
                    "image": os.environ["IMAGE"], "tag": os.environ["CANDIDATE_TAG"],
                    "digest": digest, "runId": os.environ["GITHUB_RUN_ID"],
                    "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"]}
          with open("candidate.json", "w") as output:
              json.dump(record, output, indent=2)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write(f"Candidate for qualification: `{record['image']}@{digest}`\n")
          PY

      - name: Upload candidate identity
        if: needs.publication.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ matrix.image.name }}
          path: candidate.json
