name: Container Images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/**"
      - ".mise.toml"
      - ".dockerignore"
      - "backend/**"
      - "deploy/**"
      - "go.mod"
      - "go.sum"
      - "web/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    uses: ./.github/workflows/checks.yml
  qualify:
    needs: verify
    name: Qualify packaged application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build native candidate images
        run: |
          docker build --build-arg COMMIT="$GITHUB_SHA" --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" -f deploy/Dockerfile.api -t librarry-api:stabilization .
          docker build -f deploy/Dockerfile.web -t librarry-web:stabilization .
      - name: Verify packaged imports and isolated restore
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          python3 scripts/test-packaged.py
          python3 scripts/test-worker-packaged.py
          python3 scripts/test-notification-packaged.py
      - name: Scan candidate images
        run: |
          mkdir -p output/security
          for component in api web; do
            docker save "librarry-$component:stabilization" -o "output/security/$component-image.tar"
            docker run --rm -v "$PWD/output/security:/scan" aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 image --input "/scan/$component-image.tar" --scanners vuln --quiet --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 --format json --output "/scan/$component-scan.json"
          done
      - name: Upload image scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-vulnerability-reports
          path: output/security/*-scan.json
          if-no-files-found: ignore
  build:
    needs: [verify, qualify]
    name: Build ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: librarry-api
            dockerfile: deploy/Dockerfile.api
          - name: librarry-web
            dockerfile: deploy/Dockerfile.web

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Record build identity
        id: identity
        run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and optionally push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '0.4.2-dev' }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.identity.outputs.time }}
          push: ${{ github.event_name != 'pull_request' }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
